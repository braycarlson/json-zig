[package]
name = "json_bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
simd-json = { version = "=0.19.0", default-features = false, features = ["serde_impl", "swar-number-parsing"] }
sonic-rs = "=0.5.10"

[profile.release]
codegen-units = 1
lto = "fat"
